<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — The Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
    .login-card { width: 100%; max-width: 400px; }
    .login-card h1 { font-family: "Playfair Display", serif; margin: 0 0 .25rem; }
    .login-sub { color: var(--muted-foreground); margin: 0 0 1.25rem; }
    .divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: var(--muted-foreground); font-size: .85rem; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
    #google-btn { display: flex; justify-content: center; min-height: 44px; }
    .login-error { color: var(--destructive); font-size: .9rem; min-height: 1.25rem; margin: .5rem 0 0; }
    .back-link { display: block; text-align: center; margin-top: 1rem; color: var(--muted-foreground); }
  </style>
</head>
<body>
  <main class="login-wrap">
    <div class="panel login-card">
      <h1>Welcome to The <span class="gold">Bakery</span></h1>
      <p class="login-sub">Sign in to continue</p>

      <!-- Google sign in -->
      <div id="google-btn"></div>

      <div class="divider">or sign in with email</div>

      <!-- Email + password sign in -->
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-gold full">Sign in</button>
      </form>

      <p class="login-error" id="login-error" role="alert"></p>
      <a class="back-link" href="index.html">← Back to the website</a>
    </div>
  </main>

  <!-- login.js goes BEFORE the Google script so onGoogleLibraryLoad exists when Google loads -->
  <script src="login.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
